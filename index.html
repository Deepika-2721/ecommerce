<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Shopping — Storefront</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-bag-heart-fill text-primary"></i> OnlineShopping
            </a>
            <button class="navbar-toggler text-white" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link active" href="index.html">Shop Catalog</a></li>
                    <li class="nav-item"><a class="nav-link" href="orders.html">My Orders</a></li>
                </ul>
                <div class="d-flex align-items-center">
                    <a href="cart.html" class="btn btn-outline-light me-3 position-relative">
                        <i class="bi bi-cart3"></i> Cart
                        <span id="cartBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
                    </a>
                    <div id="navAuthContainer" class="d-flex align-items-center">
                        <!-- Populated by auth.js -->
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Header -->
    <header class="py-4 bg-white border-bottom shadow-sm mb-4">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-6">
                    <h2 class="fw-bold mb-1">Discover Featured Products</h2>
                    <p class="text-muted mb-0">Browse our latest collections with flexible Cash and Credit Limit purchasing.</p>
                </div>
                <!-- GitHub Pages deployment test -->
                <!-- Search & Filters -->
                <div class="col-lg-6 mt-3 mt-lg-0">
                    <div class="row g-2">
                        <div class="col-sm-5">
                            <select id="storeCategoryFilter" class="form-select">
                                <option value="all">All Categories</option>
                            </select>
                        </div>
                        <div class="col-sm-4">
                            <select id="storeSortBy" class="form-select">
                                <option value="default">Sort by Default</option>
                                <option value="price-low">Price: Low to High</option>
                                <option value="price-high">Price: High to Low</option>
                                <option value="title">Product Name</option>
                            </select>
                        </div>
                        <div class="col-sm-3">
                            <input type="text" id="storeSearchInput" class="form-control" placeholder="Search...">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Product Catalog Grid -->
    <main class="main-content container pb-5">
        <div id="catalogContainer" class="row">
            <!-- Dynamically populated by store.js -->
        </div>

        <!-- Store Pagination -->
        <div class="d-flex justify-content-center mt-4">
            <nav>
                <ul id="storePaginationNav" class="pagination">
                    <!-- Populated by store.js -->
                </ul>
            </nav>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-4 mt-auto">
        <div class="container">
            <p class="mb-0 text-muted small">&copy; 2026 Online Shopping Web App. Firebase REST API & Cloud Firestore Architecture.</p>
        </div>
    </footer>

    <!-- jQuery & Bootstrap Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- App Logic Scripts (Direct Firebase REST API, No SDK) -->
    <script src="assets/js/firebase-api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/store.js"></script>
</body>
</html>
